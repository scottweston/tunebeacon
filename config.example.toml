version = 1

[players]
# Stable DesktopEntry keys, ordered from highest to lowest priority.
allowlist = []

[verification]
# false is strict mode; true publishes marked failures.
publish_unverified = false

[mqtt]
enabled = false
host = ""
port = 1883
tls = false
username = ""
password = ""
topic = "tunebeacon/your-hostname/now-playing"
qos = 1
retain = false

[webhook]
enabled = false
url = "https://example.com/hooks/now-playing"
# Optional Authorization: Bearer header. Masked in the TUI.
bearer_token = ""

[lastfm]
enabled = false
# Create an API account at https://www.last.fm/api/account/create, enter its
# application credentials here, then press "a" on the Last.fm TUI tab.
api_key = ""
shared_secret = ""
# Filled after browser authorization. The shared secret and session key are
# masked in the TUI.
session_key = ""
username = ""

[listenbrainz]
enabled = false
# Copy the user token from https://listenbrainz.org/settings/. The token is
# masked in the TUI; press "c" there to validate it and show the account name.
token = ""
username = ""
